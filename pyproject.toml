[project]
name = "luxafor"
version = "0.1.0"
description = "This is a template repository for Python projects that use uv for their dependency management."
authors = [{ name = "Joe Black", email = "me@joeblack.nyc" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anyio>=4.8.0",
    "furl>=2.1.3",
    "hid>=1.0.7",
    "httpx>=0.28.1",
    "importlib-metadata >=7.1.0,<8; python_version < '3.10'",
    "loguru>=0.7.3",
    "typer>=0.26.7",
]

[project.scripts]
luxafor = "luxafor.__main__:app"

[project.urls]
"Bug Tracker" = "https://github.com/joeblackwaslike/luxafor/issues"
Homepage = "https://joeblackwaslike.github.io/luxafor/"
Repository = "https://github.com/joeblackwaslike/luxafor"
Documentation = "https://joeblackwaslike.github.io/luxafor/"

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "wemake-python-styleguide>=1.0.0",
    "deptry>=0.22.0",
    "mypy>=1.13",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
    "ipython>=8.32.0",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
# pytest config: http://doc.pytest.org/en/latest/customize.html
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # maccabe
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simpify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T100", # flake8-debugger
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "A005",   # allow to shadow stdlib and builtin module names
    "COM812", # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    "D100",
    "D104",
    "D106",
    "D203",
    "D212",
    "D401",
    "D404",
    "D405",
    "E501",    # line too long
    "E731",    # do not assign lambda
    "ISC001",  # implicit string concat conflicts with `ruff format`
    "ISC003",  # prefer explicit string concat over implicit concat
    "PLR09",   # we have our own complexity rules
    "PLR2004", # do not report magic numbers
    "PLR6301", # do not require classmethod / staticmethod when self not used
    "TRY003",  # long exception messages from `tryceratops`
]
external = [ "WPS" ]

# Plugin configs:
flake8-import-conventions.banned-from = [ "ast" ]
flake8-quotes.inline-quotes = "double"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101", # asserts
  "S105", # hardcoded passwords
  "S106", # hardcoded password arguments
  "S404", # subprocess calls are for tests
  "S603", # do not require `shell=True`
  "S607", # partial executable paths
  "D101", # docstrings on public classes
  "D102", # docstrings on public methods
  "D103", # docstrings on public functions
]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.coverage.run]
# Coverage configuration: https://coverage.readthedocs.io/
branch = true
source = ["src"]

[tool.coverage.report]
skip_empty = true

